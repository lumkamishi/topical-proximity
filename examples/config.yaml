# config.yaml -- describe the business this audit is for.
# Everything in `business` is injected into the LLM prompt.

business:
  name: "Helios Solar"
  type: "residential solar installation company"
  location: "Austin, TX"
  description: |
    Helios Solar is a residential solar installer serving the Austin metro.
    Services include solar panel installation, battery backup systems, EV
    charger installation, and ongoing maintenance. They also do commercial
    solar projects up to 500kW. They do not sell standalone products or
    operate as an affiliate site.

classification:
  # Provider: "openai" or "anthropic"
  provider: "openai"

  # Model id for the chosen provider.
  #   openai:    gpt-5.4 (recommended)
  #   anthropic: claude-opus-4-7      (best quality)
  #              claude-sonnet-4-6    (balanced cost/quality)
  #              claude-haiku-4-5     (cheapest)
  model: "gpt-5.4"

  workers: 8
  fetch_content: true                       # crawl URLs missing Content column
  content_max_chars: 4000
  verify_alignment_range: [0.35, 0.65]      # re-classify rows in this band
  checkpoint_every: 25
